<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Query Checker | BMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for table */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">
    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold text-lg">Q</div>
            <div>
                <h1 class="font-bold text-slate-800 leading-tight">Query Checker</h1>
                <p class="text-xs text-slate-500">BMS Data Validator</p>
            </div>
        </div>
        <div>
            <a href="/dashboard" class="text-sm text-slate-600 hover:text-indigo-600 font-medium px-4 py-2 rounded-md hover:bg-slate-50 transition-colors">Kembali ke Dashboard</a>
        </div>
    </nav>

    <main class="p-6 max-w-[1400px] mx-auto">
        <!-- Filter Section -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-6">
            <h2 class="text-sm font-bold text-slate-700 mb-4 flex items-center gap-2">
                <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                Filter Transaksi
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Perusahaan</label>
                    <select id="company" class="w-full text-sm border border-slate-300 rounded-md p-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                        <option value="BMS_26_PRODUCTION">BMS 26 PRODUCTION</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal Mulai</label>
                    <input type="date" id="date_from" value="2026-01-01" class="w-full text-sm border border-slate-300 rounded-md p-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal Akhir</label>
                    <input type="date" id="date_to" value="2026-12-31" class="w-full text-sm border border-slate-300 rounded-md p-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Tag Akuntansi</label>
                    <select id="tag_name" class="w-full text-sm border border-slate-300 rounded-md p-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                        <option value="">-- Memuat Tags... --</option>
                    </select>
                </div>
            </div>
            <div class="mt-4 flex justify-end">
                <button onclick="fetchData()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-5 py-2 rounded-md shadow-sm transition-all flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    Tarik Data
                </button>
            </div>
        </div>

        <!-- Results Table -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[600px]">
            <div class="px-5 py-3 border-b border-slate-200 bg-slate-50/50 flex justify-between items-center">
                <h3 class="text-sm font-bold text-slate-700">Hasil Query</h3>
                <span id="row-count" class="text-xs font-medium text-slate-500 bg-slate-200 px-2 py-1 rounded-full">0 Baris</span>
            </div>
            <div class="overflow-auto flex-1 p-0">
                <table class="w-full text-left border-collapse text-sm whitespace-nowrap">
                    <thead class="bg-slate-50 sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th class="p-3 text-xs font-semibold text-slate-600 border-b border-slate-200">Tanggal</th>
                            <th class="p-3 text-xs font-semibold text-slate-600 border-b border-slate-200">No. Jurnal</th>
                            <th class="p-3 text-xs font-semibold text-slate-600 border-b border-slate-200">Deskripsi</th>
                            <th class="p-3 text-xs font-semibold text-slate-600 border-b border-slate-200">Akun (Account)</th>
                            <th class="p-3 text-xs font-semibold text-slate-600 border-b border-slate-200 text-right">Debit</th>
                            <th class="p-3 text-xs font-semibold text-slate-600 border-b border-slate-200 text-right">Kredit</th>
                            <th class="p-3 text-xs font-semibold text-slate-600 border-b border-slate-200 text-right">Saldo (Balance)</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="7" class="p-8 text-center text-slate-400 text-sm">
                                Silakan pilih filter dan klik "Tarik Data"
                            </td>
                        </tr>
                    </tbody>
                    <tfoot id="table-footer" class="bg-slate-50 sticky bottom-0 z-10 shadow-[0_-1px_2px_rgba(0,0,0,0.05)] hidden">
                        <tr>
                            <th colspan="4" class="p-3 text-sm font-bold text-slate-700 text-right">TOTAL</th>
                            <th id="total-debit" class="p-3 text-sm font-bold text-slate-700 text-right">0</th>
                            <th id="total-credit" class="p-3 text-sm font-bold text-slate-700 text-right">0</th>
                            <th id="total-balance" class="p-3 text-sm font-bold text-indigo-600 text-right">0</th>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </main>

    <script>
        const formatMoney = (amount) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR' }).format(amount);
        };

        async function loadTags() {
            try {
                // Reuse builder API if available
                let res = await fetch('/api/builder/tags?company_id=1');
                let tags = await res.json();
                let sel = document.getElementById('tag_name');
                sel.innerHTML = '<option value="">-- Pilih Semua Tag --</option>';
                
                // Sort tags alphabetically
                tags.sort();
                
                tags.forEach(t => {
                    sel.innerHTML += `<option value="${t}">${t}</option>`;
                });
            } catch(e) {
                console.error("Failed to load tags", e);
                document.getElementById('tag_name').innerHTML = '<option value="">Gagal memuat tags</option>';
            }
        }

        async function fetchData() {
            let btn = document.querySelector('button');
            let originalText = btn.innerHTML;
            btn.innerHTML = 'Memuat...';
            btn.disabled = true;

            let tbody = document.getElementById('table-body');
            tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-slate-400 text-sm">Sedang mengambil data dari DuckDB...</td></tr>';
            
            try {
                let payload = {
                    db_name: document.getElementById('company').value,
                    date_from: document.getElementById('date_from').value,
                    date_to: document.getElementById('date_to').value,
                    tag_name: document.getElementById('tag_name').value
                };

                let res = await fetch('/api/checker/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                let data = await res.json();
                
                if (data.status === 'success') {
                    document.getElementById('row-count').innerText = `${data.data.length} Baris`;
                    
                    if (data.data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-slate-500 text-sm bg-amber-50">Tidak ada transaksi ditemukan untuk kriteria ini.</td></tr>';
                        document.getElementById('table-footer').classList.add('hidden');
                        return;
                    }
                    
                    let html = '';
                    let tDebit = 0;
                    let tCredit = 0;
                    let tBalance = 0;
                    
                    data.data.forEach(row => {
                        tDebit += row.debit;
                        tCredit += row.credit;
                        tBalance += row.balance;
                        
                        html += `
                        <tr class="hover:bg-slate-50/80 transition-colors">
                            <td class="p-3 text-slate-600">${row.date}</td>
                            <td class="p-3 font-medium text-slate-800">${row.move_name || '-'}</td>
                            <td class="p-3 text-slate-600 truncate max-w-xs" title="${row.label || ''}">${row.label || '-'}</td>
                            <td class="p-3 text-slate-600"><span class="font-mono text-xs bg-slate-100 px-1 rounded text-slate-500 mr-1">${row.account_code || ''}</span> ${row.account_name || ''}</td>
                            <td class="p-3 text-slate-600 text-right">${formatMoney(row.debit)}</td>
                            <td class="p-3 text-slate-600 text-right">${formatMoney(row.credit)}</td>
                            <td class="p-3 font-medium ${row.balance < 0 ? 'text-red-500' : 'text-slate-800'} text-right">${formatMoney(row.balance)}</td>
                        </tr>
                        `;
                    });
                    
                    tbody.innerHTML = html;
                    
                    // Update totals
                    document.getElementById('total-debit').innerText = formatMoney(tDebit);
                    document.getElementById('total-credit').innerText = formatMoney(tCredit);
                    document.getElementById('total-balance').innerText = formatMoney(tBalance);
                    document.getElementById('table-footer').classList.remove('hidden');
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-red-500 text-sm">Error: ${data.message}</td></tr>`;
                }
            } catch(e) {
                console.error(e);
                tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-red-500 text-sm">Gagal terhubung ke server.</td></tr>`;
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadTags();
        });
    </script>
</body>
</html>
